services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    environment:
      SONGCUT_INASEG_BATCH_SIZE: ${SONGCUT_INASEG_BATCH_SIZE:-32}
      SONGCUT_INASEG_ENERGY_RATIO: ${SONGCUT_INASEG_ENERGY_RATIO:-0.03}
      SONGCUT_INASEG_CHUNK_SECONDS: ${SONGCUT_INASEG_CHUNK_SECONDS:-800}
      SONGCUT_INASEG_CHUNK_OVERLAP_SECONDS: ${SONGCUT_INASEG_CHUNK_OVERLAP_SECONDS:-90}
      SONGCUT_INASEG_MIN_MUSIC_RATIO: ${SONGCUT_INASEG_MIN_MUSIC_RATIO:-0.55}
      SONGCUT_INASEG_NOENERGY_BRIDGE_SECONDS: ${SONGCUT_INASEG_NOENERGY_BRIDGE_SECONDS:-4}
      SONGCUT_BOUNDARY_REFINEMENT_ENABLED: ${SONGCUT_BOUNDARY_REFINEMENT_ENABLED:-true}
      TF_CPP_MIN_LOG_LEVEL: ${TF_CPP_MIN_LOG_LEVEL:-2}
    gpus: all
