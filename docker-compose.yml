services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: songcuts-app
    restart: unless-stopped
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      UPLOAD_PASSWORD: ${UPLOAD_PASSWORD:-}
      BREC_CONFIG_PATH: /app_data/.brec_integration.json
      BILI_UPLOAD_CONFIG_PATH: /app_data/.bili_upload_config.json
      BILI_UPLOAD_COOKIE_DIR: /app_data/bili_cookies
      BILI_UPLOAD_TEMP_DIR: /app_data/bili_upload_temp
      PROCESSED_RECORDINGS_PATH: /app_data/processed_recordings.json
      SONG_RECOGNITION_CACHE_PATH: /app_data/song_recognition_cache.json
      BREC_DEFAULT_API_BASE_URL: http://recorder:2356
      BREC_DEFAULT_WORKDIR: /recorder-data
      BREC_DEFAULT_API_USERNAME: ${BREC_HTTP_BASIC_USER:-admin}
      BREC_DEFAULT_API_PASSWORD: ${BREC_HTTP_BASIC_PASS:-}
      BREC_DEFAULT_AUTO_CATEGORY: ${BREC_DEFAULT_AUTO_CATEGORY:-录播姬自动提取}
      BREC_DEFAULT_OUTPUT_FORMAT: mp3
      ACRCLOUD_HOST: ${ACRCLOUD_HOST:-}
      ACRCLOUD_ACCESS_KEY: ${ACRCLOUD_ACCESS_KEY:-}
      ACRCLOUD_ACCESS_SECRET: ${ACRCLOUD_ACCESS_SECRET:-}
      ACRCLOUD_SAMPLE_DURATION_SECONDS: ${ACRCLOUD_SAMPLE_DURATION_SECONDS:-12}
      ACRCLOUD_SKIP_INTRO_SECONDS: ${ACRCLOUD_SKIP_INTRO_SECONDS:-18}
      ACRCLOUD_MIN_CONFIDENCE: ${ACRCLOUD_MIN_CONFIDENCE:-0.68}
      ACRCLOUD_HIGH_CONFIDENCE: ${ACRCLOUD_HIGH_CONFIDENCE:-0.90}
      ACRCLOUD_MIN_CONFIRMATIONS: ${ACRCLOUD_MIN_CONFIRMATIONS:-2}
      ACRCLOUD_MAX_SAMPLES: ${ACRCLOUD_MAX_SAMPLES:-8}
      ACRCLOUD_ENERGY_SAMPLE_ENABLED: ${ACRCLOUD_ENERGY_SAMPLE_ENABLED:-true}
      ACRCLOUD_ENERGY_HOP_SECONDS: ${ACRCLOUD_ENERGY_HOP_SECONDS:-4}
      ACRCLOUD_ENERGY_MIN_ACTIVE_RATIO: ${ACRCLOUD_ENERGY_MIN_ACTIVE_RATIO:-0.55}
      ACRCLOUD_SAMPLE_MIN_DISTANCE_SECONDS: ${ACRCLOUD_SAMPLE_MIN_DISTANCE_SECONDS:-6}
      ACRCLOUD_SAMPLE_FILTER: ${ACRCLOUD_SAMPLE_FILTER:-}
      ACRCLOUD_RETRY_ENABLED: ${ACRCLOUD_RETRY_ENABLED:-true}
      ACRCLOUD_RETRY_MAX_SAMPLES: ${ACRCLOUD_RETRY_MAX_SAMPLES:-6}
      ACRCLOUD_RETRY_GRID_SECONDS: ${ACRCLOUD_RETRY_GRID_SECONDS:-45}
      SONGCUT_BOUNDARY_ALIGNMENT_ENABLED: ${SONGCUT_BOUNDARY_ALIGNMENT_ENABLED:-true}
      SONGCUT_MEDLEY_SPLIT_ENABLED: ${SONGCUT_MEDLEY_SPLIT_ENABLED:-true}
      SONGCUT_ALIGNMENT_MIN_SHIFT_SECONDS: ${SONGCUT_ALIGNMENT_MIN_SHIFT_SECONDS:-2}
      SONGCUT_ALIGNMENT_TOLERANCE_SECONDS: ${SONGCUT_ALIGNMENT_TOLERANCE_SECONDS:-10}
      SONGCUT_ALIGNMENT_MAX_EXTEND_START_SECONDS: ${SONGCUT_ALIGNMENT_MAX_EXTEND_START_SECONDS:-90}
      SONGCUT_ALIGNMENT_MAX_EXTEND_END_SECONDS: ${SONGCUT_ALIGNMENT_MAX_EXTEND_END_SECONDS:-30}
      SONGCUT_ALIGNMENT_MAX_SHRINK_SECONDS: ${SONGCUT_ALIGNMENT_MAX_SHRINK_SECONDS:-30}
      SONGCUT_ALIGNMENT_MAX_SHRINK_END_SECONDS: ${SONGCUT_ALIGNMENT_MAX_SHRINK_END_SECONDS:-10}
      SONGCUT_MIN_SUSTAINED_ACTIVE_SECONDS: ${SONGCUT_MIN_SUSTAINED_ACTIVE_SECONDS:-10}
      SONGCUT_MAX_ACTIVITY_CV: ${SONGCUT_MAX_ACTIVITY_CV:-0.62}
      SONGCUT_MIN_ACTIVITY_RATIO: ${SONGCUT_MIN_ACTIVITY_RATIO:-0.35}
      SONGCUT_ALIGNMENT_MIN_TRACK_DURATION_SECONDS: ${SONGCUT_ALIGNMENT_MIN_TRACK_DURATION_SECONDS:-90}
      SONGCUT_ALIGNMENT_MAX_TRACK_DURATION_SECONDS: ${SONGCUT_ALIGNMENT_MAX_TRACK_DURATION_SECONDS:-1200}
      SONGCUT_INTRO_SEARCH_SECONDS: ${SONGCUT_INTRO_SEARCH_SECONDS:-30}
      SONGCUT_INTRO_SILENCE_SECONDS: ${SONGCUT_INTRO_SILENCE_SECONDS:-4}
      SONGCUT_OUTRO_SEARCH_SECONDS: ${SONGCUT_OUTRO_SEARCH_SECONDS:-45}
      SONGCUT_OUTRO_SILENCE_SECONDS: ${SONGCUT_OUTRO_SILENCE_SECONDS:-4}
      SONGCUT_BOUNDARY_REFINEMENT_ENABLED: ${SONGCUT_BOUNDARY_REFINEMENT_ENABLED:-true}
      SONGCUT_INASEG_CHUNK_OVERLAP_SECONDS: ${SONGCUT_INASEG_CHUNK_OVERLAP_SECONDS:-90}
      SONGCUT_INASEG_MIN_MUSIC_RATIO: ${SONGCUT_INASEG_MIN_MUSIC_RATIO:-0.55}
      # 歌词识别回退（翻唱识别）：Whisper 转写 + lrclib 歌词搜索；模型缓存在 /app_data/hf_cache
      SONGCUT_LYRIC_RECOGNITION_ENABLED: ${SONGCUT_LYRIC_RECOGNITION_ENABLED:-true}
      SONGCUT_WHISPER_MODEL: ${SONGCUT_WHISPER_MODEL:-medium}
      SONGCUT_WHISPER_DEVICE: ${SONGCUT_WHISPER_DEVICE:-auto}
      SONGCUT_WHISPER_COMPUTE_TYPE: ${SONGCUT_WHISPER_COMPUTE_TYPE:-}
      SONGCUT_LYRIC_MIN_MATCH: ${SONGCUT_LYRIC_MIN_MATCH:-0.55}
      SONGCUT_LYRIC_MAX_WINDOWS: ${SONGCUT_LYRIC_MAX_WINDOWS:-3}
      SONGCUT_LYRIC_WINDOW_SECONDS: ${SONGCUT_LYRIC_WINDOW_SECONDS:-45}
      SONGCUT_LRCLIB_BASE_URL: ${SONGCUT_LRCLIB_BASE_URL:-https://lrclib.net}
      SONGCUT_NETEASE_API_BASE: ${SONGCUT_NETEASE_API_BASE:-https://music.163.com}
      HF_HOME: /app_data/hf_cache
      RECORDING_CLEANUP_ENABLED: ${RECORDING_CLEANUP_ENABLED:-true}
      RECORDING_CLEANUP_THRESHOLD_GB: ${RECORDING_CLEANUP_THRESHOLD_GB:-250}
      RECORDING_CLEANUP_TARGET_GB: ${RECORDING_CLEANUP_TARGET_GB:-220}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./assets:/app/assets
      - ./logs:/app/logs
      - ./data/app:/app_data
      - ./data/recorder:/recorder-data
    depends_on:
      - recorder

  recorder:
    image: bililive/recorder:latest
    container_name: bililive-recorder
    restart: unless-stopped
    command: ["run", "--bind", "http://*:2356", "/rec"]
    environment:
      BREC_HTTP_BASIC_USER: ${BREC_HTTP_BASIC_USER:-admin}
      BREC_HTTP_BASIC_PASS: ${BREC_HTTP_BASIC_PASS:-}
    ports:
      - "127.0.0.1:2356:2356"
    volumes:
      - ./data/recorder:/rec
